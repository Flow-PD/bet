<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>个人投注记录</title>
<style>
  :root {
    --bg: #f4f6fb;
    --card: #ffffff;
    --text: #1f2733;
    --muted: #8a93a3;
    --line: #e9edf3;
    --brand: #3b6ef5;
    --brand-soft: #eaf0ff;
    --red: #e83b3b;
    --red-soft: #fdeaea;
    --black: #2b3340;
    --black-soft: #eceff3;
    --green: #1ba672;
    --shadow: 0 6px 24px rgba(31,39,51,.08);
    --radius: 16px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 16px; padding-bottom: 40px; }

  /* Header */
  .topbar {
    position: sticky; top: 12px; z-index: 20;
    width: calc(100% - 32px);
    max-width: 828px;
    margin: 16px auto 0;
    background: linear-gradient(135deg, #3b6ef5, #5b8bff);
    color: #fff; border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  .topbar-inner { padding: 16px; }
  .topbar h1 { margin: 0 0 2px; font-size: 19px; font-weight: 700; letter-spacing: .5px; }
  .topbar .sub { font-size: 12px; opacity: .85; margin-bottom: 14px; }
  .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  @media (min-width: 560px) { .stats { grid-template-columns: repeat(4, 1fr); } }
  .stat { background: rgba(255,255,255,.16); border-radius: 12px; padding: 12px 12px; backdrop-filter: blur(4px); }
  .stat .label { font-size: 11px; opacity: .82; margin-bottom: 4px; }
  .stat .value { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat .value.pos { color: #ff9a9a; }   /* 盈利 = 红 */
  .stat .value.neg { color: #8ff0bf; }   /* 亏 = 绿 */
  .winbar-wrap { margin-top: 12px; }
  .winbar-head { display:flex; justify-content: space-between; font-size: 12px; margin-bottom: 6px; opacity:.9; }
  .winbar { height: 8px; background: rgba(255,255,255,.25); border-radius: 99px; overflow: hidden; }
  .winbar > i { display:block; height:100%; background:#fff; border-radius:99px; transition: width .4s ease; }

  /* Section card */
  .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin-top: 16px; }
  .card h2 { font-size: 15px; margin: 0 0 14px; display:flex; align-items:center; gap:8px; }
  .card h2 .dot { width:8px;height:8px;border-radius:99px;background:var(--brand); }

  /* Form */
  .form-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
  @media (min-width: 560px) { .form-grid { grid-template-columns: 1fr 1fr; } }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field.full { grid-column: 1 / -1; }
  .field label { font-size: 12px; color: var(--muted); font-weight: 600; }
  .field input, .field select {
    border: 1.5px solid var(--line); border-radius: 11px;
    padding: 11px 12px; font-size: 15px; color: var(--text);
    background: #fbfcfe; outline: none; width: 100%;
    transition: border-color .15s, box-shadow .15s; font-family: inherit;
  }
  .field input:focus, .field select:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); background:#fff; }
  .seg { display: flex; gap: 8px; }
  .seg label {
    flex: 1; text-align: center; padding: 11px 0; border-radius: 11px;
    border: 1.5px solid var(--line); cursor: pointer; font-size: 15px;
    font-weight: 600; color: var(--muted); background: #fbfcfe; transition: all .15s;
  }
  .seg input { display: none; }
  .seg label.red.on { background: var(--red-soft); border-color: var(--red); color: var(--red); }
  .seg label.black.on { background: var(--black-soft); border-color: var(--black); color: var(--black); }
  .hint { font-size: 11px; color: var(--muted); }
  .actions { display:flex; gap: 10px; margin-top: 4px; }
  .btn { border: none; border-radius: 12px; padding: 13px 16px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; transition: transform .08s, opacity .15s; flex: 1; }
  .btn:active { transform: scale(.98); }
  .btn-primary { background: var(--brand); color: #fff; }
  .btn-ghost { background: var(--brand-soft); color: var(--brand); flex: 0 0 auto; }

  /* Chips / profile */
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { border: 1.5px solid var(--line); background:#fff; color: var(--text); padding: 7px 13px; border-radius: 99px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all .15s; }
  .chip i { width: 9px; height: 9px; border-radius: 99px; display: inline-block; }
  .chip.on { background: var(--brand); border-color: var(--brand); color: #fff; }
  .chip.on i { box-shadow: 0 0 0 2px rgba(255,255,255,.7); }
  .manage { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
  .prow { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1.5px solid var(--line); border-radius: 11px; }
  .prow i { width: 10px; height: 10px; border-radius: 99px; flex: 0 0 auto; }
  .prow .pn { flex: 1; font-weight: 600; font-size: 14px; }
  .prow input.pn-input { flex: 1; font-weight: 600; font-size: 14px; font-family: inherit; color: var(--text); border: 1.5px solid transparent; background: transparent; border-radius: 8px; padding: 5px 8px; min-width: 0; }
  .prow input.pn-input:hover { border-color: var(--line); background: #fff; }
  .prow input.pn-input:focus { border-color: var(--brand); background: #fff; outline: none; box-shadow: 0 0 0 3px var(--brand-soft); }
  .prow button { border: 1.5px solid var(--line); background:#fff; border-radius: 8px; padding: 5px 10px; font-size: 12px; font-weight: 600; cursor: pointer; color: var(--muted); }
  .prow button:hover { border-color: var(--brand); color: var(--brand); }
  .prow button.del:hover { border-color: var(--red); color: var(--red); }

  /* Filters */
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .pill { border: 1.5px solid var(--line); background:#fff; color: var(--muted); padding: 7px 14px; border-radius: 99px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all .15s; }
  .pill.on { background: var(--brand); border-color: var(--brand); color:#fff; }
  .toolbar { display:flex; justify-content: space-between; align-items:center; gap:8px; flex-wrap: wrap; }
  .toolbar .right { display:flex; gap:8px; flex-wrap: wrap; }
  .mini { border: 1.5px solid var(--line); background:#fff; color: var(--text); padding: 8px 12px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all .15s; }
  .mini:hover { border-color: var(--brand); color: var(--brand); }
  .mini.danger:hover { border-color: var(--red); color: var(--red); }

  /* Compare table */
  .table-wrap { overflow-x: auto; }
  table.cmp { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 520px; }
  table.cmp th, table.cmp td { padding: 10px 8px; text-align: right; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  table.cmp th:first-child, table.cmp td:first-child { text-align: left; }
  table.cmp th { color: var(--muted); font-weight: 600; font-size: 12px; white-space: nowrap; }
  table.cmp td .dot { display: inline-block; width: 8px; height: 8px; border-radius: 99px; margin-right: 6px; vertical-align: middle; }
  table.cmp tr.total td { font-weight: 700; border-top: 2px solid var(--line); }
  .pos { color: var(--red); } .neg { color: var(--green); }   /* 盈利=红 亏=绿（中国习惯） */

  /* List */
  .list { display: flex; flex-direction: column; gap: 10px; }
  .empty { text-align:center; color: var(--muted); padding: 36px 10px; font-size: 14px; }
  .rec { border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
  .rec-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .rec-head { min-width: 0; flex: 1; }
  .rec .event { font-weight: 700; font-size: 15px; word-break: break-word; }
  .rec .date { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .rec-right { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
  .rec .tag { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 99px; white-space: nowrap; }
  .rec .tag.red { background: var(--red-soft); color: var(--red); }
  .rec .tag.black { background: var(--black-soft); color: var(--black); }
  .rec .meta { display:flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: #4a5464; }
  .rec .meta b { color: var(--text); font-variant-numeric: tabular-nums; }
  .rec .meta .pl.pos { color: var(--red); font-weight: 700; }
  .rec .meta .pl.neg { color: var(--green); font-weight: 700; }
  /* 红单高亮：赛事名变红 + 左侧红条 */
  .rec.red-event { border-left: 4px solid var(--red); }
  .rec.red-event .event { color: var(--red); font-weight: 800; }
  /* 添加重复时的对比弹窗 */
  .dup-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 480px) { .dup-grid { grid-template-columns: 1fr; } }
  .dup-col { border: 1.5px solid var(--line); border-radius: 12px; padding: 12px; background: #fbfcfe; }
  .dup-col.new { border-color: var(--brand); background: #f5f8ff; }
  .dup-col h4 { margin: 0 0 10px; font-size: 13px; display: flex; align-items: center; gap: 6px; }
  .dup-col.new h4 { color: var(--brand); }
  .dup-col.old h4 { color: var(--muted); }
  .dup-f { display: flex; flex-direction: column; gap: 4px; margin-bottom: 9px; }
  .dup-f label { font-size: 11px; color: var(--muted); font-weight: 600; }
  .dup-f input, .dup-f select { border: 1.5px solid var(--line); border-radius: 9px; padding: 8px 9px; font-size: 14px; font-family: inherit; outline: none; width: 100%; background: #fff; }
  .dup-f input:focus, .dup-f select:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .dup-net { font-size: 12px; font-weight: 700; margin-top: 2px; text-align: right; }
  .dup-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
  .dup-actions button { flex: 1; min-width: 108px; border: none; border-radius: 11px; padding: 11px 8px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .dup-save { background: var(--brand); color: #fff; }
  .dup-overwrite { background: #f5a623; color: #fff; }
  .dup-keep { background: var(--black-soft); color: var(--text); }
  /* 历史列表按记录人分组 */
  .list-group-head { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; margin: 16px 2px 8px; color: var(--text); }
  .list-group-head .dot { width: 10px; height: 10px; border-radius: 99px; flex: 0 0 auto; }
  .list-group-head .gg-net { margin-left: auto; font-variant-numeric: tabular-nums; }
  .list-group-head:first-child { margin-top: 0; }
  .rec .meta .pname { font-weight: 700; }
  .rec .ops { display:flex; gap:6px; }
  .rec .ops button { border: 1.5px solid var(--line); background: #fff; color: var(--muted); cursor: pointer; font-size: 12px; padding: 3px 9px; border-radius: 8px; white-space: nowrap; }
  .rec .ops button:hover { border-color: var(--brand); color: var(--brand); }
  .rec .ops button.del:hover { border-color: var(--red); color: var(--red); }

  .foot { text-align:center; color: var(--muted); font-size: 12px; margin-top: 24px; }

  /* Modal (替代原生 alert/confirm/prompt，本地文件下弹窗常被浏览器拦截) */
  .modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,.45); display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
  .modal-card { background: #fff; border-radius: 16px; padding: 22px; max-width: 340px; width: 100%; box-shadow: 0 24px 60px rgba(0,0,0,.28); }
  .modal-msg { font-size: 15px; line-height: 1.6; margin-bottom: 18px; color: var(--text); white-space: pre-line; }
  .modal-actions { display: flex; gap: 10px; }
  .modal-actions button { flex: 1; border: none; border-radius: 11px; padding: 12px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .modal-cancel { background: var(--black-soft); color: var(--text); }
  .modal-ok { background: var(--brand); color: #fff; }
  .modal-ok.danger { background: var(--red); }
  .modal-input { width: 100%; border: 1.5px solid var(--line); border-radius: 11px; padding: 11px 12px; font-size: 15px; color: var(--text); background: #fbfcfe; outline: none; font-family: inherit; margin-bottom: 14px; }
  .modal-input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); background: #fff; }
  .modal-label { font-size: 12px; color: var(--muted); font-weight: 600; margin-bottom: 6px; display: block; }
</style>
</head>
<body>
  <div class="topbar">
   <div class="topbar-inner">
    <h1>个人投注记录</h1>
    <div class="sub" id="view-sub">全部记录</div>
    <div class="stats">
      <div class="stat"><div class="label">总投入</div><div class="value" id="s-input">¥0</div></div>
      <div class="stat"><div class="label">总返还</div><div class="value" id="s-return">¥0</div></div>
      <div class="stat"><div class="label">净盈亏</div><div class="value" id="s-net">¥0</div></div>
      <div class="stat"><div class="label">胜率(红单率)</div><div class="value" id="s-win">0%</div></div>
    </div>
    <div class="winbar-wrap">
      <div class="winbar-head"><span>红单率</span><span id="win-pct-txt">0%</span></div>
      <div class="winbar"><i id="win-bar" style="width:0%"></i></div>
    </div>
   </div>
  </div>

  <div class="wrap">
    <!-- Profiles -->
    <div class="card">
      <h2><span class="dot"></span>记录人 / 账本</h2>
      <div class="chips" id="profile-chips"></div>
      <button class="mini" id="add-profile-btn" style="margin-top:10px;">+ 新建记录人</button>
      <div class="manage" id="profile-manage"></div>
    </div>

    <!-- Add form -->
    <div class="card">
      <h2><span class="dot"></span>添加投注记录</h2>
      <form id="add-form" class="form-grid" autocomplete="off">
        <div class="field">
          <label for="f-profile">记录人</label>
          <select id="f-profile"></select>
        </div>
        <div class="field">
          <label for="f-date">日期</label>
          <input type="date" id="f-date" required />
        </div>
        <div class="field">
          <label for="f-event">赛事名称</label>
          <input type="text" id="f-event" placeholder="例如：欧冠 皇马vs巴萨" required />
        </div>
        <div class="field">
          <label for="f-amount">投注金额</label>
          <input type="number" id="f-amount" placeholder="0" min="0" step="0.01" required />
        </div>
        <div class="field">
          <label for="f-odds">赔率（自动）</label>
          <input type="text" id="f-odds" placeholder="奖金÷金额" readonly />
          <span class="hint">根据下方「奖金」自动计算，保留 2 位小数</span>
        </div>
        <div class="field">
          <label>结果</label>
          <div class="seg" id="f-seg">
            <label class="red" id="lab-red"><input type="radio" name="result" value="红" checked /><span>红 (命中)</span></label>
            <label class="black" id="lab-black"><input type="radio" name="result" value="黑" /><span>黑 (未中)</span></label>
          </div>
        </div>
        <div class="field">
          <label for="f-bonus">奖金（返还）</label>
          <input type="number" id="f-bonus" placeholder="实得返还，如 1080" min="0" step="0.01" required />
          <span class="hint">赔率 = 奖金 ÷ 投注金额，自动算出</span>
        </div>
        <div class="field full">
          <div class="actions">
            <button type="submit" class="btn btn-primary">+ 添加记录</button>
          </div>
        </div>
      </form>
    </div>

    <!-- Compare -->
    <div class="card">
      <h2><span class="dot"></span>对比分析</h2>
      <div class="table-wrap"><table class="cmp" id="compare-table"></table></div>
    </div>

    <!-- List -->
    <div class="card">
      <div class="toolbar" style="margin-bottom:14px;">
        <h2 style="margin:0;"><span class="dot"></span>历史记录</h2>
        <div class="right">
          <button class="mini" id="import-btn">导入 CSV</button>
          <button class="mini" id="export-btn">导出 CSV</button>
          <button class="mini danger" id="clear-btn">清空</button>
          <input type="file" id="import-file" accept=".csv,text/csv" style="display:none" />
        </div>
      </div>
      <div class="filters" id="filters">
        <span class="pill on" data-f="all">全部</span>
        <span class="pill" data-f="红">红</span>
        <span class="pill" data-f="黑">黑</span>
      </div>
      <div class="list" id="list"></div>
    </div>

    <div class="foot">数据仅保存在本机浏览器中 · 建议定期导出 CSV 备份</div>
  </div>

  <div id="modal-overlay" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-msg" id="modal-msg"></div>
      <div class="modal-actions" id="modal-actions"></div>
    </div>
  </div>

  <div id="dup-overlay" class="modal-overlay">
    <div class="modal-card" style="max-width: 560px;">
      <div class="modal-msg" id="dup-title" style="font-weight:700;font-size:15px;margin-bottom:12px;"></div>
      <div id="dup-body"></div>
      <div class="dup-actions" id="dup-actions"></div>
    </div>
  </div>

<script>
(function () {
  "use strict";
  var PKEY = "bet_profiles_v2";
  var RKEY = "bet_records_v2";
  var PALETTE = ["#3b6ef5", "#e83b3b", "#1ba672", "#f5a623", "#8b5cf6", "#ec4899", "#06b6d4", "#64748b"];
  var profiles = [];
  var records = [];
  var currentView = "all";   // "all" or profile id
  var resultFilter = "all";    // all / 红 / 黑

  // ---------- storage ----------
  function load() {
    try { profiles = JSON.parse(localStorage.getItem(PKEY)) || []; } catch (e) { profiles = []; }
    try { records = JSON.parse(localStorage.getItem(RKEY)) || []; } catch (e) { records = []; }
    if (!Array.isArray(profiles)) profiles = [];
    if (!Array.isArray(records)) records = [];
    if (profiles.length === 0) { profiles.push({ id: uid(), name: "我自己", color: PALETTE[0] }); saveProfiles(); }
    // migrate legacy records without profile
    records.forEach(function (r) {
      if (!r.profile || !profiles.some(function (p) { return p.id === r.profile; })) r.profile = profiles[0].id;
    });
  }
  function saveProfiles() { localStorage.setItem(PKEY, JSON.stringify(profiles)); }
  function saveRecords() { localStorage.setItem(RKEY, JSON.stringify(records)); }

  // ---------- helpers ----------
  function fmtMoney(n) {
    if (!isFinite(n)) n = 0;
    var sign = n < 0 ? "-" : "";
    var v = Math.abs(n).toLocaleString("zh-CN", { minimumFractionDigits: 0, maximumFractionDigits: 2 });
    return sign + "¥" + v;
  }
  function fmtPct(n) { if (!isFinite(n)) n = 0; return (n * 100).toFixed(1) + "%"; }
  function calcBonus(rec) {
    var amount = parseFloat(rec.amount) || 0, odds = parseFloat(rec.odds) || 0;
    if (rec.result === "红") return Math.round(amount * odds * 100) / 100;
    return 0;
  }
  function yieldOf(rec) {
    var amount = parseFloat(rec.amount) || 0, bonus = parseFloat(rec.bonus) || 0;
    if (amount <= 0) return 0;
    return (bonus - amount) / amount;
  }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function getProfile(id) { return profiles.find(function (p) { return p.id === id; }); }
  function getProfileName(id) { var p = getProfile(id); return p ? p.name : "?"; }
  function getProfileColor(id) { var p = getProfile(id); return p ? p.color : "#888"; }
  function nextColor() {
    var used = profiles.map(function (p) { return p.color; });
    for (var i = 0; i < PALETTE.length; i++) if (used.indexOf(PALETTE[i]) < 0) return PALETTE[i];
    return PALETTE[profiles.length % PALETTE.length];
  }
  function findOrCreateProfile(name) {
    name = (name || "").trim();
    if (!name) {
      if (profiles.length === 0) profiles.push({ id: uid(), name: "我自己", color: nextColor() });
      return profiles[0].id;
    }
    var p = profiles.find(function (x) { return x.name.toLowerCase() === name.toLowerCase(); });
    if (p) return p.id;
    var id = uid();
    profiles.push({ id: id, name: name, color: nextColor() });
    saveProfiles();
    return id;
  }

  // ---------- modal (替代原生 alert/confirm/prompt，本地文件下弹窗常被浏览器拦截) ----------
  var modalOverlay = document.getElementById("modal-overlay");
  var modalMsg = document.getElementById("modal-msg");
  var modalActions = document.getElementById("modal-actions");
  function openModal(html, buttons) {
    modalMsg.innerHTML = html;
    modalActions.innerHTML = "";
    buttons.forEach(function (b) {
      var el = document.createElement("button");
      el.textContent = b.label;
      el.className = "modal-" + (b.primary ? "ok" : "cancel") + (b.danger ? " danger" : "");
      el.addEventListener("click", function () { closeModal(); if (b.onClick) b.onClick(); });
      modalActions.appendChild(el);
    });
    modalOverlay.style.display = "flex";
  }
  function closeModal() { modalOverlay.style.display = "none"; modalMsg.innerHTML = ""; modalActions.innerHTML = ""; }
  function showAlert(msg, onOk) { openModal(escapeHtml(msg), [{ label: "知道了", primary: true, onClick: onOk }]); }
  function showConfirm(msg, onOk, danger) { openModal(escapeHtml(msg), [{ label: "取消" }, { label: "确认", primary: true, danger: danger, onClick: onOk }]); }

  // ---------- 重复记录对比弹窗（添加时检测到重复用） ----------
  var dupOverlay = document.getElementById("dup-overlay");
  function openDupModal(newRec, oldRec) {
    var optHtml = profiles.map(function (p) { return '<option value="' + p.id + '">' + escapeHtml(p.name) + "</option>"; }).join("");
    function fields(side, rec) {
      return '<div class="dup-col ' + (side === "N" ? "new" : "old") + '">' +
        '<h4>' + (side === "N" ? "新记录（本次添加）" : "历史记录（已存在）") + "</h4>" +
        '<div class="dup-f"><label>记录人</label><select id="dup' + side + '-profile">' + optHtml + "</select></div>" +
        '<div class="dup-f"><label>日期</label><input type="date" id="dup' + side + '-date" value="' + escapeHtml(rec.date || "") + '" /></div>' +
        '<div class="dup-f"><label>赛事名称</label><input type="text" id="dup' + side + '-event" value="' + escapeHtml(rec.event || "") + '" /></div>' +
        '<div class="dup-f"><label>投注金额</label><input type="number" id="dup' + side + '-amount" step="0.01" value="' + (rec.amount || 0) + '" /></div>' +
        '<div class="dup-f"><label>赔率</label><input type="number" id="dup' + side + '-odds" step="0.01" value="' + (rec.odds || 0) + '" /></div>' +
        '<div class="dup-f"><label>结果</label><select id="dup' + side + '-result">' +
          '<option value="红"' + (rec.result === "红" ? " selected" : "") + ">红</option>" +
          '<option value="黑"' + (rec.result === "黑" ? " selected" : "") + ">黑</option></select></div>" +
        '<div class="dup-f"><label>奖金（返还）</label><input type="number" id="dup' + side + '-bonus" step="0.01" value="' + (rec.bonus || 0) + '" /></div>' +
        '<div class="dup-net" id="dup' + side + '-net"></div>' +
        "</div>";
    }
    document.getElementById("dup-title").textContent = "发现疑似重复记录（同一记录人、同日、同赛事、同金额）";
    document.getElementById("dup-body").innerHTML = '<div class="dup-grid">' + fields("N", newRec) + fields("O", oldRec) + "</div>";
    var actions = document.getElementById("dup-actions");
    actions.innerHTML = "";
    function addBtn(label, cls, fn) { var b = document.createElement("button"); b.textContent = label; b.className = cls; b.addEventListener("click", fn); actions.appendChild(b); }
    addBtn("保存新记录（都保留）", "dup-save", function () {
      closeDup();
      records.push(readDupRec("N")); saveRecords(); afterAddReset(); renderAll();
    });
    addBtn("用新版覆盖旧版", "dup-overwrite", function () {
      closeDup();
      var nr = readDupRec("N");
      oldRec.profile = nr.profile; oldRec.date = nr.date; oldRec.event = nr.event;
      oldRec.amount = nr.amount; oldRec.odds = nr.odds; oldRec.result = nr.result; oldRec.bonus = nr.bonus;
      saveRecords(); afterAddReset(); renderAll();
    });
    addBtn("保留旧版（不添加）", "dup-keep", function () { closeDup(); afterAddReset(); });

    document.getElementById("dupN-profile").value = newRec.profile;
    document.getElementById("dupO-profile").value = oldRec.profile;
    updateDupNet("N"); updateDupNet("O");
    ["N", "O"].forEach(function (side) {
      ["amount", "odds", "bonus"].forEach(function (f) {
        document.getElementById("dup" + side + "-" + f).addEventListener("input", function () {
          if (f !== "odds") {
            var amt = parseFloat(document.getElementById("dup" + side + "-amount").value) || 0;
            var bn = parseFloat(document.getElementById("dup" + side + "-bonus").value) || 0;
            if (amt > 0) document.getElementById("dup" + side + "-odds").value = (bn / amt).toFixed(2);
          }
          updateDupNet(side);
        });
      });
    });
    dupOverlay.style.display = "flex";
  }
  function updateDupNet(side) {
    var amt = parseFloat(document.getElementById("dup" + side + "-amount").value) || 0;
    var b = parseFloat(document.getElementById("dup" + side + "-bonus").value) || 0;
    var net = b - amt;
    var roi = amt > 0 ? net / amt : 0;
    var cls = net >= 0 ? "pos" : "neg";
    document.getElementById("dup" + side + "-net").innerHTML =
      "纯盈利 <span class=\"" + cls + "\">" + fmtMoney(net) + "</span> · 收益率 <span class=\"" + cls + "\">" + fmtPct(roi) + "</span>";
  }
  function readDupRec(side) {
    return {
      id: uid(),
      profile: document.getElementById("dup" + side + "-profile").value,
      date: document.getElementById("dup" + side + "-date").value,
      event: (document.getElementById("dup" + side + "-event").value || "").trim(),
      amount: parseFloat(document.getElementById("dup" + side + "-amount").value) || 0,
      odds: parseFloat(document.getElementById("dup" + side + "-odds").value) || 0,
      result: document.getElementById("dup" + side + "-result").value,
      bonus: parseFloat(document.getElementById("dup" + side + "-bonus").value) || 0
    };
  }
  function closeDup() { dupOverlay.style.display = "none"; document.getElementById("dup-body").innerHTML = ""; document.getElementById("dup-actions").innerHTML = ""; }
  function afterAddReset() {
    document.getElementById("f-event").value = "";
    document.getElementById("f-amount").value = "";
    document.getElementById("f-odds").value = "";
    document.getElementById("f-bonus").value = "";
    document.getElementById("f-event").focus();
  }

  // ---------- stats ----------
  function compute(rs) {
    var input = 0, ret = 0, win = 0;
    rs.forEach(function (r) { input += parseFloat(r.amount) || 0; ret += parseFloat(r.bonus) || 0; if (r.result === "红") win++; });
    return { input: input, ret: ret, net: ret - input, win: win, count: rs.length, winRate: rs.length ? win / rs.length : 0 };
  }
  function renderStats() {
    var rs = currentView === "all" ? records : records.filter(function (r) { return r.profile === currentView; });
    var s = compute(rs);
    document.getElementById("s-input").textContent = fmtMoney(s.input);
    document.getElementById("s-return").textContent = fmtMoney(s.ret);
    var netEl = document.getElementById("s-net");
    netEl.textContent = fmtMoney(s.net);
    netEl.className = "value " + (s.net > 0 ? "pos" : s.net < 0 ? "neg" : "");
    document.getElementById("s-win").textContent = fmtPct(s.winRate);
    document.getElementById("win-pct-txt").textContent = fmtPct(s.winRate);
    document.getElementById("win-bar").style.width = (s.winRate * 100) + "%";
  }

  // ---------- profiles UI ----------
  function renderProfileChips() {
    var box = document.getElementById("profile-chips");
    var html = '<span class="chip' + (currentView === "all" ? " on" : "") + '" data-view="all"><i style="background:#cbd5e1"></i>全部</span>';
    html += profiles.map(function (p) {
      return '<span class="chip' + (currentView === p.id ? " on" : "") + '" data-view="' + p.id + '"><i style="background:' + p.color + '"></i>' + escapeHtml(p.name) + '</span>';
    }).join("");
    box.innerHTML = html;
  }
  function renderManage() {
    var box = document.getElementById("profile-manage");
    box.innerHTML = profiles.map(function (p) {
      return '<div class="prow" data-id="' + p.id + '"><i style="background:' + p.color + '"></i>' +
        '<input class="pn-input" data-id="' + p.id + '" value="' + escapeHtml(p.name) + '" aria-label="记录人名字" placeholder="记录人名字" />' +
        '<button class="del" data-act="del" data-id="' + p.id + '">' + (profiles.length <= 1 ? "删除" : "删除") + '</button></div>';
    }).join("");
  }
  function fillProfileSelect() {
    var sel = document.getElementById("f-profile");
    sel.innerHTML = profiles.map(function (p) { return '<option value="' + p.id + '">' + escapeHtml(p.name) + '</option>'; }).join("");
    var def = (currentView !== "all" && getProfile(currentView)) ? currentView : profiles[0].id;
    sel.value = def;
  }
  function renderProfiles() { renderProfileChips(); renderManage(); fillProfileSelect(); }

  // ---------- compare ----------
  function renderCompare() {
    var box = document.getElementById("compare-table");
    var rows = profiles.map(function (p) {
      var s = compute(records.filter(function (r) { return r.profile === p.id; }));
      return { p: p, s: s, roi: s.input > 0 ? s.net / s.input : 0 };
    });
    rows.sort(function (a, b) { return b.s.net - a.s.net; });
    var total = compute(records);
    var troi = total.input > 0 ? total.net / total.input : 0;

    var head = "<thead><tr><th>记录人</th><th>笔数</th><th>总投入</th><th>总返还</th><th>净盈亏</th><th>胜率</th><th>收益率</th></tr></thead>";
    var body = "<tbody>" + rows.map(function (row) {
      var netCls = row.s.net > 0 ? "pos" : row.s.net < 0 ? "neg" : "";
      return "<tr>" +
        '<td><span class="dot" style="background:' + row.p.color + '"></span>' + escapeHtml(row.p.name) + "</td>" +
        "<td>" + row.s.count + "</td>" +
        "<td>" + fmtMoney(row.s.input) + "</td>" +
        "<td>" + fmtMoney(row.s.ret) + "</td>" +
        '<td class="' + netCls + '">' + fmtMoney(row.s.net) + "</td>" +
        "<td>" + fmtPct(row.s.winRate) + "</td>" +
        '<td class="' + netCls + '">' + fmtPct(row.roi) + "</td>" +
        "</tr>";
    }).join("");
    var tcls = total.net > 0 ? "pos" : total.net < 0 ? "neg" : "";
    body += '<tr class="total"><td>合计</td><td>' + total.count + "</td>" +
      "<td>" + fmtMoney(total.input) + "</td><td>" + fmtMoney(total.ret) + "</td>" +
      '<td class="' + tcls + '">' + fmtMoney(total.net) + "</td><td>" + fmtPct(total.winRate) + "</td>" +
      '<td class="' + tcls + '">' + fmtPct(troi) + "</td></tr></tbody>";
    box.innerHTML = head + body;
  }

  // ---------- list ----------
  function sortRecs(arr) { arr.sort(function (a, b) { return (b.date + b.id).localeCompare(a.date + a.id); }); return arr; }
  function renderRec(r) {
    var y = yieldOf(r), plClass = y >= 0 ? "pos" : "neg";
    var plText = (y >= 0 ? "+" : "") + fmtPct(y);
    var tagClass = r.result === "红" ? "red" : "black";
    return '<div class="rec' + (r.result === "红" ? " red-event" : "") + '" data-id="' + r.id + '">' +
      '<div class="rec-top">' +
        '<div class="rec-head">' +
          '<div class="event">' + escapeHtml(r.event) + '</div>' +
          '<div class="date">' + (r.date || "未注明") + '</div>' +
        '</div>' +
        '<div class="rec-right">' +
          '<span class="tag ' + tagClass + '">' + r.result + '</span>' +
          '<span class="ops"><button class="edit" data-id="' + r.id + '">编辑</button>' +
          '<button class="del" data-id="' + r.id + '">删除</button></span>' +
        '</div>' +
      '</div>' +
      '<div class="meta">' +
        '<span>投入 <b>' + fmtMoney(r.amount) + '</b></span>' +
        '<span>赔率 <b>' + (parseFloat(r.odds) || 0) + '</b></span>' +
        '<span>奖金 <b>' + fmtMoney(r.bonus) + '</b></span>' +
        '<span>纯盈利 <b class="pl ' + plClass + '">' + fmtMoney((parseFloat(r.bonus) || 0) - (parseFloat(r.amount) || 0)) + '</b></span>' +
        '<span>收益率 <b class="pl ' + plClass + '">' + plText + '</b></span>' +
      '</div></div>';
  }
  function renderList() {
    var box = document.getElementById("list");
    var base = records.filter(function (r) {
      if (resultFilter !== "all" && r.result !== resultFilter) return false;
      return true;
    });
    if (records.length === 0) { box.innerHTML = '<div class="empty">还没有记录，添加第一笔吧 📝</div>'; return; }

    if (currentView === "all") {
      var html = "";
      profiles.forEach(function (p) {
        var rs = sortRecs(base.filter(function (r) { return r.profile === p.id; }));
        if (rs.length === 0) return;
        var s = compute(rs);
        var netCls = s.net > 0 ? "pos" : s.net < 0 ? "neg" : "";
        html += '<div class="list-group-head"><span class="dot" style="background:' + p.color + '"></span>' +
          escapeHtml(p.name) + ' <span style="font-weight:400;opacity:.6;font-size:12px;">· ' + s.count + '笔</span>' +
          '<span class="gg-net ' + netCls + '">' + fmtMoney(s.net) + '</span></div>';
        html += rs.map(renderRec).join("");
      });
      box.innerHTML = html || '<div class="empty">没有符合条件的记录</div>';
    } else {
      var rs2 = sortRecs(base.filter(function (r) { return r.profile === currentView; }));
      box.innerHTML = rs2.length ? rs2.map(renderRec).join("") : '<div class="empty">没有符合条件的记录</div>';
    }
  }

  function renderAll() { renderProfiles(); renderStats(); renderCompare(); renderList(); }

  // ---------- form ----------
  var form = document.getElementById("add-form");
  (function setToday() {
    var d = new Date();
    document.getElementById("f-date").value = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  })();
  function syncSeg() {
    var val = document.querySelector('input[name="result"]:checked').value;
    document.getElementById("lab-red").classList.toggle("on", val === "红");
    document.getElementById("lab-black").classList.toggle("on", val === "黑");
    var b = document.getElementById("f-bonus");
    if (val === "黑" && b.value === "") b.value = "0";
    autoOdds();
  }
  document.querySelectorAll('input[name="result"]').forEach(function (el) { el.addEventListener("change", syncSeg); });
  syncSeg();

  function autoOdds() {
    var amount = parseFloat(document.getElementById("f-amount").value) || 0;
    var bonus = parseFloat(document.getElementById("f-bonus").value) || 0;
    var o = document.getElementById("f-odds");
    o.value = (amount > 0) ? (bonus / amount).toFixed(2) : "";
  }
  ["f-amount", "f-bonus"].forEach(function (id) { document.getElementById(id).addEventListener("input", autoOdds); });

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var rec = {
      id: uid(),
      profile: document.getElementById("f-profile").value,
      date: document.getElementById("f-date").value,
      event: document.getElementById("f-event").value.trim(),
      amount: parseFloat(document.getElementById("f-amount").value) || 0,
      odds: parseFloat(document.getElementById("f-odds").value) || 0,
      result: document.querySelector('input[name="result"]:checked').value,
      bonus: parseFloat(document.getElementById("f-bonus").value) || 0
    };
    if (!rec.date || !rec.event) return;

    // 重复检测：同一记录人 + 同日 + 同赛事 + 同金额
    var dup = records.find(function (r) {
      return r.profile === rec.profile && r.date === rec.date && r.event === rec.event &&
        Math.abs((parseFloat(r.amount) || 0) - rec.amount) < 0.001;
    });
    if (dup) { openDupModal(rec, dup); return; }

    records.push(rec);
    saveRecords();
    renderAll();
    afterAddReset();
  });

  // ---------- profile chips ----------
  document.getElementById("profile-chips").addEventListener("click", function (e) {
    var c = e.target.closest(".chip"); if (!c) return;
    currentView = c.getAttribute("data-view");
    var p = getProfile(currentView);
    document.getElementById("view-sub").textContent = currentView === "all" ? "全部记录 · 列表按记录人分组" : ("记录人：" + (p ? p.name : ""));
    if (currentView !== "all" && getProfile(currentView)) document.getElementById("f-profile").value = currentView;
    renderProfileChips(); renderStats(); renderList();
  });

  // ---------- manage (rename inline / delete) ----------
  document.getElementById("profile-manage").addEventListener("click", function (e) {
    var btn = e.target.closest("button"); if (!btn) return;
    var id = btn.getAttribute("data-id"), act = btn.getAttribute("data-act");
    var p = getProfile(id); if (!p) return;
    if (act === "del") {
      if (profiles.length <= 1) { showAlert("至少保留一个记录人"); return; }
      var cnt = records.filter(function (r) { return r.profile === id; }).length;
      showConfirm("删除记录人「" + escapeHtml(p.name) + "」" + (cnt ? "及其 " + cnt + " 条记录？" : "？") + "\n此操作不可恢复", function () {
        profiles = profiles.filter(function (x) { return x.id !== id; });
        records = records.filter(function (r) { return r.profile !== id; });
        if (currentView === id) currentView = "all";
        saveProfiles(); saveRecords(); renderAll();
      }, true);
    }
  });
  document.getElementById("profile-manage").addEventListener("change", function (e) {
    var inp = e.target.closest(".pn-input"); if (!inp) return;
    var id = inp.getAttribute("data-id");
    var p = getProfile(id); if (!p) return;
    var name = inp.value.trim();
    if (!name) { inp.value = p.name; return; }
    if (profiles.some(function (x) { return x.id !== id && x.name.toLowerCase() === name.toLowerCase(); })) { showAlert("已存在同名记录人"); inp.value = p.name; return; }
    p.name = name; saveProfiles(); renderAll();
  });
  document.getElementById("add-profile-btn").addEventListener("click", function () {
    openModal(
      '<div class="modal-label">新建记录人名字</div>' +
      '<input class="modal-input" id="modal-name" placeholder="例如：小花" />',
      [{ label: "取消" }, { label: "创建", primary: true, onClick: function () {
        var name = (document.getElementById("modal-name").value || "").trim();
        if (!name) return;
        if (profiles.some(function (p) { return p.name.toLowerCase() === name.toLowerCase(); })) { showAlert("已存在同名记录人"); return; }
        profiles.push({ id: uid(), name: name, color: nextColor() });
        saveProfiles(); renderAll();
      } }]
    );
    setTimeout(function () { var el = document.getElementById("modal-name"); if (el) el.focus(); }, 50);
  });

  // ---------- list ops ----------
  document.getElementById("list").addEventListener("click", function (e) {
    var btn = e.target.closest("button"); if (!btn) return;
    var id = btn.getAttribute("data-id");
    if (btn.classList.contains("del")) {
      showConfirm("确定删除这条记录？\n此操作不可恢复", function () {
        records = records.filter(function (r) { return r.id !== id; });
        saveRecords(); renderAll();
      }, true);
    } else if (btn.classList.contains("edit")) {
      var r = records.find(function (x) { return x.id === id; }); if (!r) return;
      var amount = parseFloat(r.amount) || 0;
      var curNet = Math.round(((parseFloat(r.bonus) || 0) - amount) * 100) / 100;
      openModal(
        '<div class="modal-label">修改日期（YYYY-MM-DD，可留空）</div>' +
        '<input class="modal-input" id="modal-date" value="' + escapeHtml(r.date || "") + '" />' +
        '<div class="modal-label">纯盈利（实际盈亏，亏损用负数，如 -50）</div>' +
        '<input class="modal-input" id="modal-net" value="' + curNet.toFixed(2) + '" />',
        [{ label: "取消" }, { label: "保存", primary: true, onClick: function () {
          var nd = (document.getElementById("modal-date").value || "").trim();
          var nn = parseFloat(document.getElementById("modal-net").value);
          if (!isNaN(nn)) { r.date = nd; r.bonus = Math.round((amount + nn) * 100) / 100; r.odds = amount > 0 ? Math.round((r.bonus / amount) * 100) / 100 : 0; saveRecords(); renderAll(); }
        } }]
      );
      setTimeout(function () { var el = document.getElementById("modal-date"); if (el) el.focus(); }, 50);
    }
  });

  // ---------- filters ----------
  document.getElementById("filters").addEventListener("click", function (e) {
    var pill = e.target.closest(".pill"); if (!pill) return;
    resultFilter = pill.getAttribute("data-f");
    document.querySelectorAll("#filters .pill").forEach(function (p) { p.classList.toggle("on", p === pill); });
    renderList();
  });

  // ---------- export CSV ----------
  document.getElementById("export-btn").addEventListener("click", function () {
    if (records.length === 0) { showAlert("暂无数据可导出"); return; }
    var header = ["记录人", "日期", "赛事名称", "投注金额", "赔率", "结果", "奖金"];
    var rows = records.map(function (r) {
      return [getProfileName(r.profile), r.date, r.event, parseFloat(r.amount) || 0, parseFloat(r.odds) || 0, r.result, parseFloat(r.bonus) || 0];
    });
    var csv = [header].concat(rows).map(function (row) {
      return row.map(function (c) {
        var s = String(c);
        if (/[",\n]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
        return s;
      }).join(",");
    }).join("\r\n");
    var blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8;" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    var d = new Date();
    a.href = url; a.download = "投注记录_" + d.getFullYear() + String(d.getMonth() + 1).padStart(2, "0") + String(d.getDate()).padStart(2, "0") + ".csv";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  // ---------- clear all ----------
  document.getElementById("clear-btn").addEventListener("click", function () {
    if (records.length === 0) { showAlert("已经是空的了"); return; }
    showConfirm("确定清空所有记录？\n此操作不可恢复（建议先导出 CSV 备份）", function () { records = []; saveRecords(); renderAll(); }, true);
  });

  // ---------- import CSV ----------
  var importFile = document.getElementById("import-file");
  document.getElementById("import-btn").addEventListener("click", function () { importFile.click(); });
  importFile.addEventListener("change", function () {
    var file = this.files && this.files[0]; if (!file) return;
    var reader = new FileReader();
    reader.onload = function (e) {
      try {
        var imported = parseCsv(e.target.result);
        if (!imported.length) { showAlert("没有解析到任何记录，请检查 CSV 格式"); return; }
        var seen = {};
        records.forEach(function (r) { seen[key(r)] = r; });
        var added = 0, updated = 0;
        imported.forEach(function (r) {
          var k = key(r);
          if (seen[k]) { seen[k].bonus = r.bonus; seen[k].odds = r.odds; updated++; }
          else { records.push(r); seen[k] = r; added++; }
        });
        // 导入后清理「没有任何记录」的空账本，避免对比表出现空占位
        profiles = profiles.filter(function (p) { return records.some(function (r) { return r.profile === p.id; }); });
        if (profiles.length === 0) { profiles.push({ id: uid(), name: "我自己", color: PALETTE[0] }); }
        saveProfiles(); saveRecords(); renderAll();
        showAlert("成功导入 " + added + " 条、更新 " + updated + " 条（共读取 " + imported.length + " 条；" + profiles.length + " 个记录人）");
      } catch (err) { showAlert("导入失败：" + err.message); }
      finally { importFile.value = ""; }
    };
    reader.readAsText(file, "UTF-8");
  });

  function key(r) { return [r.profile, r.date, r.event, r.amount, r.odds, r.result].join("|"); }

  function parseCsv(text) {
    var lines = text.replace(/\r\n/g, "\n").replace(/\r/g, "\n").split("\n");
    var hi = -1, header = null;
    for (var i = 0; i < lines.length; i++) {
      if (lines[i].trim() === "") continue;
      header = splitCsvLine(lines[i]);
      if (header.some(function (c) { return c && c.trim(); })) { hi = i; break; }
    }
    if (hi < 0) return [];
    var keys = {
      profile: ["记录人", "账本", "profile", "name", "谁", "人", "记录者"],
      date: ["日期", "时间", "date"],
      event: ["赛事名称", "计划", "赛事", "项目", "event", "备注", "描述"],
      amount: ["投注金额", "投入", "金额", "本金", "amount"],
      odds: ["赔率", "odds"],
      result: ["结果", "中否", "输赢", "红黑", "中/否", "result"],
      bonus: ["奖金", "返还", "派奖", "返奖", "bonus", "return"]
    };
    var map = {};
    Object.keys(keys).forEach(function (k) {
      var names = keys[k];
      for (var j = 0; j < header.length; j++) {
        var h = (header[j] || "").trim().toLowerCase();
        if (names.some(function (n) { return h === n.toLowerCase() || h.indexOf(n.toLowerCase()) >= 0; })) { map[k] = j; break; }
      }
    });
    if (map.amount === undefined) throw new Error("未在表头中找到「投注金额」列");
    var defaultProfile = (profiles.length && currentView !== "all" && getProfile(currentView)) ? currentView : (profiles[0] ? profiles[0].id : null);

    var out = [];
    for (var i = hi + 1; i < lines.length; i++) {
      if (lines[i].trim() === "") continue;
      var cols = splitCsvLine(lines[i]);
      var get = function (k) { return map[k] !== undefined ? (cols[map[k]] || "").trim() : ""; };
      var amount = parseFloat(get("amount"));
      if (isNaN(amount)) continue;
      var odds = parseFloat(String(get("odds")).replace(/[优化]/g, ""));
      if (isNaN(odds)) odds = 0;
      var result = /[中红赢胜]/.test(get("result")) ? "红" : "黑";
      var bonusRaw = parseFloat(get("bonus"));
      var bonus;
      if (isNaN(bonusRaw)) {
        // 奖金为空：赔率仅作参考、不用于推算；黑单返还0，红单暂记保本(返还=投入)待手动修正
        bonus = (result === "黑") ? 0 : amount;
      } else {
        bonus = Math.round(bonusRaw * 100) / 100; // 直接采用表中奖金(即返还/中奖金额)
      }
      var pid = map.profile !== undefined ? findOrCreateProfile(get("profile")) : defaultProfile;
      if (!pid) {
        if (profiles.length === 0) profiles.push({ id: uid(), name: "我自己", color: nextColor() });
        pid = profiles[0].id;
      }
      out.push({
        id: uid(),
        profile: pid,
        date: normImportDate(get("date")),
        event: get("event") || "(未命名)",
        amount: amount, odds: odds, result: result, bonus: bonus
      });
    }
    return out;
  }

  function splitCsvLine(line) {
    var res = [], cur = "", q = false;
    for (var i = 0; i < line.length; i++) {
      var c = line[i];
      if (q) { if (c === '"') { if (line[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
      else { if (c === '"') q = true; else if (c === ",") { res.push(cur); cur = ""; } else cur += c; }
    }
    res.push(cur);
    return res;
  }

  function normImportDate(s) {
    if (!s) return "";
    if (/^\d{4}[-/]\d{1,2}[-/]\d{1,2}$/.test(s)) return s.replace(/\//g, "-");
    var m = s.match(/(\d{1,2})\.(\d{1,2})/);
    if (m) return "2026-" + String(+m[1]).padStart(2, "0") + "-" + String(+m[2]).padStart(2, "0");
    return "";
  }

  // ---------- init ----------
  load();
  renderAll();
})();
</script>
